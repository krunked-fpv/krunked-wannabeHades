    <style>

         ====================================================================== */
      @font-face {

      @font-face {

      }

        font-display: swap;
      }
      @font-face {
        font-family: 'Alegreya Sans';
        src: url('./fonts/alegreya-sans-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Alegreya Sans';
        src: url('./fonts/alegreya-sans-800.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Barlow Condensed';
        src: url('./fonts/barlow-condensed-700.woff2') format('woff2');

        font-style: normal;

      @font-face {
        font-family: 'Cormorant Garamond';
        src: url('./fonts/cormorant-garamond-600.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        src: url('./fonts/cormorant-garamond-600i.woff2') format('woff2');
        font-weight: 600;
        font-style: italic;
        font-display: swap;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #09060e;
        color: #f7eedb;
        font-family: 'Alegreya Sans', sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #09060e;
        touch-action: none;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #touch-root {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        touch-action: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }

    <canvas id="game-canvas" aria-label="Krunked WannabeHades"></canvas>
