<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08070d" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2308070d'/%3E%3Cpath d='M32 7 L49 26 L41 56 L32 46 L23 56 L15 26 Z' fill='%23d9382e' stroke='%23f5cb70' stroke-width='3'/%3E%3Ccircle cx='32' cy='28' r='6' fill='%23f5cb70'/%3E%3C/svg%3E"
    />
    <title>Krunked WannabeHades</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #08070d;
        color: #f4efe6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #08070d;
        touch-action: none;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
      #touch-root {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        touch-action: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="Krunked WannabeHades"></canvas>
    <div id="ui-root"></div>
    <div id="touch-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
